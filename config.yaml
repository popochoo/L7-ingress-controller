server:
  listen_addr: ":8080"
  shutdown_timeout: "15s"

routes:
  - path: "/api/v1/tasks"
    match_type: "prefix"
    methods: ["GET", "POST"]
    rate_limit_rps: 50000
    backend:
      url: "http://mock-backends:8081"
      fallback_url: ""
    mirror:
      url: "http://mock-backends:8082"
      percentage: 100
